# ==============================================================================
# Buildbox — Kernel, Memory & Scheduler Tuning (`/etc/sysctl.d/99-buildbox.conf`)
# ==============================================================================
# Modular drop-in; never edit `/etc/sysctl.conf` directly.

# Raise inotify limits for IDEs, language servers, Flutter/Django hot-reload,
# Podman rootless containers, and parallel subagent workspaces.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576

# Zram-optimized VM behavior (paired with zstd-compressed zram swap):
# - swappiness=100 encourages moving cold anonymous pages into fast RAM-compressed zram
# - page-cluster=0 disables swap readahead (zero seek penalty in zram)
# - vfs_cache_pressure=50 keeps dentry/inode caches warm for big monorepos & Nix stores
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15

# Prevent Linux desktop session autogrouping from throttling background parallel
# compiler/test workers when an interactive browser or IDE is in the foreground.
kernel.sched_autogroup_enabled = 0
