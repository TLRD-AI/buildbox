# /etc/ostree/prepare-root.conf
# Required on Fedora Atomic / Kinoite (41+ / 45+) where composefs is enabled by default.
# Mounting `/` read-only via composefs prevents Determinate Nix's `nix-directory.service`
# from modifying immutable root attributes (`chattr -i /`). Enabling `root.transient = true`
# overlays a writable tmpfs root so `nix-mkdir.service` can create `/nix` before `nix.mount`.
#
# Activate and persist across ostree deployments with:
#   sudo rpm-ostree initramfs-etc --track=/etc/ostree/prepare-root.conf --reboot
[composefs]
enabled = yes

[sysroot]
readonly = true

[root]
transient = true
